<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainingsplan</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Trainingsplan</h1>
  
  <div class="exercise-list">
    <div class="exercise-item">
      <input type="checkbox" id="exercise1">
      <label for="exercise1">Push-ups (3 sets of 15)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise2">
      <label for="exercise2">Squats (3 sets of 20)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise3">
      <label for="exercise3">Plank (3 sets of 45 seconds)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise4">
      <label for="exercise4">Lunges (3 sets of 12 per leg)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise5">
      <label for="exercise5">Burpees (3 sets of 10)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise6">
      <label for="exercise6">Mountain Climbers (3 sets of 20)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise7">
      <label for="exercise7">Jumping Jacks (3 sets of 30)</label>
    </div>
    
    <div class="exercise-item">
      <input type="checkbox" id="exercise8">
      <label for="exercise8">Sit-ups (3 sets of 20)</label>
    </div>
  </div>
</body>

</html>
